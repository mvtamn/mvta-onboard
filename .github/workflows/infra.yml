name: Deploy infrastructure (Bicep)

# Reproducible, auditable infra deploys. Auth is OIDC federated identity - no
# cloud credentials are stored in GitHub (only the client/tenant/subscription
# IDs, which are not secrets). Configure a federated credential on a deployment
# app registration and grant it least-privilege RBAC on rg-mvta-onboard-<env>.
on:
  push:
    branches: [main]
    paths:
      - "infra-stage0/**"
      - "infra-phase1/**"
      - ".github/workflows/infra.yml"
  # A push to main deploys dev. Any other environment deploys only from here,
  # and its GitHub environment's protection rules decide who may approve it.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: infra-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: rg-mvta-onboard-${{ inputs.environment || 'dev' }}
      LOCATION: westus2
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate (what-if) stage 0
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra-stage0/main.bicep \
              --parameters "infra-stage0/parameters/$ENVIRONMENT.parameters.json" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Deploy stage 0 (network, KV, SQL, monitoring)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra-stage0/main.bicep \
              --parameters "infra-stage0/parameters/$ENVIRONMENT.parameters.json" \
              --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

      # Every environment here is live: dev until production cuts over, and
      # production after. what-if before every phase-1 deploy so changes to the
      # Function Apps / SWAs / Service Bus are reviewed in the run log first.
      - name: Validate (what-if) phase 1
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra-phase1/main-phase1.bicep \
              --parameters "infra-phase1/parameters/phase1-$ENVIRONMENT.parameters.json" \
              --parameters frontDoorId="${{ vars.FRONT_DOOR_ID }}"

      - name: Deploy phase 1 (functions, SWAs, Service Bus, WAF policy)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --name "phase1-$ENVIRONMENT" \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra-phase1/main-phase1.bicep \
              --parameters "infra-phase1/parameters/phase1-$ENVIRONMENT.parameters.json" \
              --parameters frontDoorId="${{ vars.FRONT_DOOR_ID }}"

      - name: Configure Azure Maps client identifier on REST API
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Names come from the phase-1 deployment's outputs, so they follow
            # whatever main-phase1.bicep calls them in this environment.
            maps_account=$(az deployment group show --resource-group "$RESOURCE_GROUP" \
              --name "phase1-$ENVIRONMENT" --query properties.outputs.mapsAccountName.value -o tsv)
            rest_api=$(az deployment group show --resource-group "$RESOURCE_GROUP" \
              --name "phase1-$ENVIRONMENT" --query properties.outputs.restApiFunctionName.value -o tsv)
            maps_client_id=$(az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Maps/accounts \
              --name "$maps_account" \
              --query properties.uniqueId -o tsv)
            test -n "$maps_client_id"
            az functionapp config appsettings set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$rest_api" \
              --settings AZURE_MAPS_CLIENT_ID="$maps_client_id"

      - name: Smoke-test the live API after infra changes
        uses: azure/cli@v2
        with:
          # HANDOFF §5 lesson: "config is fixed" does not mean "app recovered".
          # Check through Front Door (the real rider-facing path) - a direct
          # azurewebsites.net probe would be blocked by design once the
          # Front-Door-only inbound restriction is enabled. Fail loudly so a
          # code redeploy (func publish --force) can be triggered immediately.
          # HEALTH_CHECK_URL is a variable on each GitHub environment. Dev falls
          # back to its Front Door endpoint. A new environment has no Front
          # Door until it is built in the portal, so until the variable is set
          # the check is skipped with a notice rather than failed.
          inlineScript: |
            url="${{ vars.HEALTH_CHECK_URL }}"
            if [ -z "$url" ] && [ "$ENVIRONMENT" = "dev" ]; then
              url="https://endpoint-mvta-onboard-dev-haehgsbbe6esd8cc.z03.azurefd.net/api/health"
            fi
            if [ -z "$url" ]; then
              echo "::notice::No HEALTH_CHECK_URL on the $ENVIRONMENT environment - skipping the smoke test."
              exit 0
            fi
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            echo "Health check returned: $status"
            if [ "$status" != "200" ]; then
              echo "::error::/api/health returned $status after infra deploy - the app may need a code redeploy (see HANDOFF §5.4)."
              exit 1
            fi
