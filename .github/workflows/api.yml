name: Deploy Function Apps (REST API + dispatch + Spare webhook receiver)

on:
  push:
    branches: [main]
    paths:
      - "functions-restapi/**"
      - "functions-dispatch/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "functions-restapi/**"
      - "functions-dispatch/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migration-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares the branch against its merge base, so the
          # shallow default clone is not enough history.
          fetch-depth: 0
      - name: Fetch the base branch
        run: git fetch --no-tags origin main
      - name: No migration number this branch adds is taken on main
        run: functions-restapi/scripts/check-migration-numbers.sh origin/main

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [functions-restapi, functions-dispatch]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Build (TypeScript)
        working-directory: ${{ matrix.app }}
        run: npm run build
      - name: Unit tests
        working-directory: ${{ matrix.app }}
        run: npm test

  decision-matrix-contract:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: DecisionMatrix!2026
        ports:
          - 1433:1433
    env:
      DECISION_MATRIX_TEST_SQL_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=master;User ID=sa;Password=DecisionMatrix!2026;Encrypt=false;TrustServerCertificate=true;Connection Timeout=30;"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions-restapi/package-lock.json
      - name: Wait for SQL Server
        run: |
          for attempt in {1..30}; do
            if docker exec ${{ job.services.sql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "DecisionMatrix!2026" -C -Q "SELECT 1"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Install
        working-directory: functions-restapi
        run: npm ci
      - name: Decision Matrix database contract
        working-directory: functions-restapi
        run: npm run test:decision-matrix-contract

  deploy:
    needs: [test, decision-matrix-contract]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        include:
          - app: functions-restapi
            function_app: func-mvta-restapi-dev
          - app: functions-dispatch
            function_app: func-mvta-dispatch-dev
          # The Spare webhook receiver's own app. It is built from the REST API
          # package but loads a single entry point, so it runs the receiver and
          # a health check and none of the REST API's timers (see
          # functions-restapi/src/spareWebhookEntry.ts). The app is created by
          # the infra workflow, which can finish after this one on the merge
          # that introduces it.
          - app: functions-restapi
            function_app: func-mvta-sparehook-dev
            entry: dist/src/spareWebhookEntry.js
            expected_functions: '["health","onDemandSpareWebhook"]'
            created_by_infra: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install, build, then prune to production deps
        working-directory: ${{ matrix.app }}
        # Dev deps are needed to compile TypeScript; prune them afterwards so
        # the deployed package ships only dist/ + production node_modules.
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Load only the Spare webhook receiver
        if: matrix.entry
        working-directory: ${{ matrix.app }}
        # Rewrites package.json main on this runner's copy only, then proves
        # what that entry registers. A package that loaded the REST API's
        # functions/*.js glob would register every timer on a second app and
        # double every poller, so anything beyond the expected set fails here.
        run: |
          node scripts/set-package-main.cjs . "${{ matrix.entry }}"
          registered=$(node scripts/registered-functions.cjs --package . | tail -n 1)
          echo "Registered: $registered"
          if [ "$registered" != '${{ matrix.expected_functions }}' ]; then
            echo "::error::${{ matrix.function_app }} would register $registered, expected ${{ matrix.expected_functions }}"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm the target Function App exists
        id: target
        if: matrix.created_by_infra
        # On the merge that introduces an app, the infra workflow creates it and
        # may not have finished yet. Skip with a notice rather than fail; re-run
        # this workflow once the infra deploy is done.
        run: |
          if az resource show --resource-group rg-mvta-onboard-dev --name "${{ matrix.function_app }}" \
              --resource-type Microsoft.Web/sites --query id -o tsv > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.function_app }} does not exist yet - the infra workflow creates it. Re-run this workflow after that deploy finishes."
          fi

      - name: Deploy to Function App
        if: steps.target.outputs.exists != 'false'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ matrix.function_app }}
          package: ${{ matrix.app }}
